name: Pages

# Publishes docs/ to GitHub Pages. Pull requests that touch the docs build
# the site as a check; only pushes to main deploy it.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          # Go embedding helper, not part of the site.
          rm -f _site/embed.go
          test -f _site/index.html

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
